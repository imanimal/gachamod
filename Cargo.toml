[workspace]
resolver = "2"
members = ["crates/gacha-core", "src-tauri", "src-setup"]

[workspace.package]
version = "0.1.1-beta.5"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# gachamod setup is a download, so it is built for size (scripts/build-installer.mjs: --profile setup).
[profile.setup]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"

# The 3D preview decodes textures in dev builds too: unoptimised, a 4K DDS takes seconds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image_dds]
opt-level = 3
[profile.dev.package.bcdec_rs]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
