[package]
name = "gacha-core"
description = "Mod library, GameBanana downloads, XXMI and .gachamod logic for gachamod. No UI code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "http2", "charset"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt", "macros", "net", "process"] }
futures-util = "0.3"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd", "time"] }
sevenz-rust2 = { version = "0.20", features = ["deflate", "zstd"] }
unrar = "0.5"
md-5 = "0.10"
hex = "0.4"
walkdir = "2"
sha2 = "0.10"
getrandom = "0.3"
png = "0.18"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_Input_XboxController", "Win32_System_Registry", "Win32_System_DataExchange"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
