[package]
name = "gachamod"
description = "gachamod, a mod manager for 3DMigoto model importer games"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gachamod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gacha-core = { path = "../crates/gacha-core" }
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
url = "2"
reqwest = { version = "0.12", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
