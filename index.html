<!doctype html>
<html lang="en" data-theme="default" data-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fandom wikis answer image requests that name another site with a "not found" stand-in, so portraits go without one -->
    <meta name="referrer" content="no-referrer" />
    <title>gachamod</title>
    <!-- before the scripts: a release build gives this <style> the nonce its CSP lets inline styles in with, and the
         scripts below copy it onto the styles they add -->
    <style>
      /* first frame before the stylesheets load */
      html { background: #0c0e13; }
      html[data-scheme="light"] { background: #f3f4f7; }
      html[data-theme="zzz"]:not([data-scheme="light"]) { background: #000; }
      /* the opening screen's colour (each must match its intro's bg in src/splash/intros) */
      html[data-splash="plain"] { background: #0c0e13; }
      html[data-splash="plain"][data-scheme="light"] { background: #f3f4f7; }
      html[data-splash="zzz"] { background: #000; }
      html[data-splash="gi"] { background: #0d1328; }
      html[data-splash="hsr"] { background: #090b18; }
      html[data-splash="ww"] { background: #080b13; }
      html[data-splash="ef"] { background: #1b1b1b; }
    </style>
    <script>
      // Apply the last game's theme before first paint (lib/theme.ts does the same once the game list loads).
      (function () {
        var r = document.documentElement;
        var g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
        var game = g("gm.game") || "";
        var pick = g("gm.theme." + game);
        // nothing picked: the game's own theme (games.rs: these five have one, the rest use Default)
        var theme = pick && pick !== "auto" ? pick : /^(zzz|gi|hsr|ww|ef)$/.test(game) ? game : "default";
        var p = null;
        try { p = JSON.parse(g("gm.paint") || "null"); } catch (e) { /* no saved colours yet */ }
        var custom = p && p.game === game && p.custom && theme.indexOf("custom:") === 0 ? p.custom : null;
        if (theme.indexOf("custom:") === 0) theme = custom && custom.base ? custom.base : "default";
        // all themes dark or light (gm.schemeMode), else each theme keeps its own choice; Teyvat and Talos-II are light
        // by default, the rest dark
        var mode = g("gm.schemeMode");
        var c = (custom && custom.scheme) || (mode === "dark" || mode === "light" || mode === "system" ? mode : null) || g("gm.scheme." + theme) || (theme === "default" ? g("gm.scheme") : null) || (theme === "gi" || theme === "ef" || theme === "clay" ? "light" : "dark");
        var s = c === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : c;
        r.setAttribute("data-theme", theme);
        r.setAttribute("data-scheme", s);
        if (!custom && (mode === "dark" || mode === "light" || mode === "system")) r.setAttribute("data-full", "");
        r.setAttribute("data-game", game);
        r.setAttribute("data-accent", g("gm.accent." + theme) || "");
        r.setAttribute("data-motion", g("gm.motion") === "0" ? "reduced" : "full");
        // the opening screen (src/splash): its colour from the first frame. The intro picked in Settings ("gm.intro":
        // "0" off, missing or "theme" the theme's own, else an intro id), else the theme's. Not in the menu over a game
        // or the kit page. ?intro=<id> shows one (for working on it)
        var ask = /[?&]intro=(\w+)/.exec(location.search);
        var want = g("gm.intro");
        var meta = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata;
        var menu = location.hash === "#overlay" || location.hash === "#kit" || !!(meta && meta.currentWindow && meta.currentWindow.label === "overlay");
        if (!menu && (ask || want !== "0")) {
          var own = ask ? ask[1] : want && want !== "theme" ? want : theme;
          r.setAttribute("data-splash", /^(zzz|gi|hsr|ww|ef)$/.test(own) ? own : "plain");
        }
        if (p && p.game === game && p.vars) for (var k in p.vars) r.style.setProperty(k, p.vars[k]);
        // the layout picked in Settings (a custom theme's own layout below wins)
        var mine = null;
        try { mine = JSON.parse(g("gm.layout") || "null"); } catch (e) { /* not set */ }
        ["density", "sidebar", "nav", "corners", "format"].forEach(function (n) { if (mine && typeof mine[n] === "string") r.setAttribute("data-" + n, mine[n]); });
        if (custom) {
          // a custom theme: its checked CSS and layout, as lib/theme.ts last applied them
          r.setAttribute("data-custom", custom.id);
          var lay = custom.layout || {};
          for (var n in lay) r.setAttribute("data-" + n, lay[n]);
          var st = document.createElement("style");
          st.id = "gm-custom-theme";
          var nonce = document.querySelector("style[nonce]");
          if (nonce && nonce.nonce) st.nonce = nonce.nonce;
          st.textContent = custom.css || "";
          document.head.appendChild(st);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
