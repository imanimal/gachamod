[package]
name = "gachamod-setup"
description = "gachamod setup: installs, repairs and uninstalls gachamod"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gachamod-setup"
path = "src/main.rs"

[features]
# Release builds (scripts/build-installer.mjs) serve the page from dist-setup inside the exe instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
tokio = { version = "1", features = ["time"] }
minisign-verify = "0.3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
